<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Criar sua conta - Meu DinDin</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <link href="output.css" rel="stylesheet">
  
  
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
    
    <div class="mb-8">
      <h1 class="text-3xl font-extrabold text-on-surface tracking-tight mb-2">Criar sua conta</h1>
      <p class="text-on-surface-variant font-medium">Comece a organizar suas finanças agora</p>
    </div>

    <form id="cadastroForm" class="space-y-6">
      
      <!-- Nome -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-on-surface">Nome (opcional)</label>
        <div class="input-field flex items-center gap-3 px-4 py-3 rounded-2xl border border-gray-200 bg-white transition-all">
          <span class="material-symbols-outlined text-outline">person</span>
          <input type="text" id="nome" placeholder="Como quer ser chamado?" class="w-full bg-transparent border-none outline-none text-on-surface placeholder:text-gray-400 font-medium text-sm">
        </div>
      </div>

      <!-- Email -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-on-surface">E-mail</label>
        <div class="input-field flex items-center gap-3 px-4 py-3 rounded-2xl border border-gray-200 bg-white transition-all">
          <span class="material-symbols-outlined text-outline">mail</span>
          <input type="email" id="email" required placeholder="seu@email.com" class="w-full bg-transparent border-none outline-none text-on-surface placeholder:text-gray-400 font-medium text-sm">
        </div>
      </div>

      <!-- Senha -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-on-surface">Senha</label>
        <div class="input-field flex items-center gap-3 px-4 py-3 rounded-2xl border border-gray-200 bg-white transition-all">
          <span class="material-symbols-outlined text-outline">lock</span>
          <input type="password" id="senha" required placeholder="........" class="w-full bg-transparent border-none outline-none text-on-surface placeholder:text-gray-400 font-medium text-sm">
          <button type="button" class="text-outline hover:text-on-surface flex items-center">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
      </div>

      <!-- Confirmar Senha -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-on-surface">Confirmar senha</label>
        <div class="input-field flex items-center gap-3 px-4 py-3 rounded-2xl border border-gray-200 bg-white transition-all">
          <span class="material-symbols-outlined text-outline">lock</span>
          <input type="password" id="confirmarSenha" required placeholder="........" class="w-full bg-transparent border-none outline-none text-on-surface placeholder:text-gray-400 font-medium text-sm">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full py-4 mt-4 bg-primary hover:bg-primary-container text-white font-bold rounded-full transition-colors flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
        Continuar para o Pagamento
        <span class="material-symbols-outlined text-lg">arrow_forward</span>
      </button>
      
    </form>
    
    <p class="text-center text-xs text-gray-500 mt-6 font-medium">
      Ao criar sua conta, você será redirecionado para o ambiente seguro do Mercado Pago para efetivar a sua assinatura anual de R$ 29,00.
    </p>

  </div>

  <script>
    document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;
      const btn = document.getElementById('submitBtn');

      if (senha !== confirmarSenha) {
        alert('As senhas não conferem!');
        return;
      }

      // Desabilita botão e mostra loading
      btn.disabled = true;
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg">autorenew</span> Criando conta...';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: nome, email, password: senha })
        });

        const data = await response.json();

        if (response.ok && data.init_point) {
          // Redireciona para o Checkout do Mercado Pago
          window.location.href = data.init_point;
        } else {
          alert('Erro ao criar conta: ' + (data.error || 'Erro desconhecido'));
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      } catch (err) {
        console.error(err);
        alert('Erro de conexão ao tentar criar a conta.');
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
